<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Harmony — музыкальный плеер</title>
  <meta name="description" content="Harmony — минималистичный веб-плеер: поиск и прослушивание музыки">
  <meta name="theme-color" content="#0a0a0c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- SVG icon symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5f76f7"/>
        <stop offset="1" stop-color="#b15cf7"/>
      </linearGradient>
    </defs>
    <symbol id="i-logo" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="20" rx="7" fill="url(#logo-grad)"/>
      <path d="M7.5 14.5v-5M12 17v-10M16.5 13.5v-3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z" fill="currentColor"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z" fill="currentColor"/>
    </symbol>
    <symbol id="i-prev" viewBox="0 0 24 24">
      <path d="M19.5 5v14L9 12zM5 5h2.6v14H5z" fill="currentColor"/>
    </symbol>
    <symbol id="i-next" viewBox="0 0 24 24">
      <path d="M4.5 5v14L15 12zM16.4 5H19v14h-2.6z" fill="currentColor"/>
    </symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>
    </symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
    </symbol>
    <symbol id="i-repeat-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
    </symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z" fill="currentColor"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m3 11 9-8 9 8"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/>
    </symbol>
    <symbol id="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/>
    </symbol>
    <symbol id="i-disc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-queue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M3 6h13M3 12h13M3 18h7"/><circle cx="18" cy="17.5" r="2.5"/><path d="M20.5 17.5V9l2-.5"/>
    </symbol>
    <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>
    </symbol>
    <symbol id="i-volume-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M5 5l14 14M19 5 5 19"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    </symbol>
    <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </symbol>
    <symbol id="i-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
      <path d="M12 3a9 9 0 1 0 9 9"/>
    </symbol>
  </svg>

  <!-- ===================== App ===================== -->
  <div class="app" id="app">

    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home">
        <svg width="28" height="28"><use href="#i-logo"/></svg>
        <span>Harmony</span>
      </a>

      <nav class="nav" aria-label="Основная навигация">
        <a href="#/home" data-nav="home"><svg class="ico"><use href="#i-home"/></svg><span>Главная</span></a>
        <a href="#/search" data-nav="search"><svg class="ico"><use href="#i-search"/></svg><span>Поиск</span></a>
        <a href="#/liked" data-nav="liked"><svg class="ico"><use href="#i-heart"/></svg><span>Любимые</span></a>
      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__hint">Музыка находится по запросу и&nbsp;воспроизводится через собственный бэкенд.</div>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <h2 class="topbar__title" id="topTitle">Главная</h2>
        <div class="topbar__actions">
          <a class="icon-btn topbar__search" href="#/search" aria-label="Поиск"><svg class="ico"><use href="#i-search"/></svg></a>
        </div>
      </header>
      <div class="view" id="view"></div>
    </main>

    <aside class="queue" id="queuePanel" aria-label="Очередь воспроизведения">
      <div class="queue__head">
        <h3>Очередь</h3>
        <button class="icon-btn" id="btnQueueClose" aria-label="Закрыть очередь"><svg class="ico"><use href="#i-close"/></svg></button>
      </div>
      <div id="queueNow"></div>
      <div class="queue__caption" id="queueNextCaption">Далее</div>
      <ul class="queue__list" id="queueList"></ul>
    </aside>

    <footer class="player" id="playerBar">
      <div class="player__side player__side--left">
        <div class="player__cover" id="pbCover" aria-hidden="true"><svg class="ico"><use href="#i-music"/></svg></div>
        <div class="player__meta">
          <div class="player__title" id="pbTitle">Не выбран трек</div>
          <div class="player__artist" id="pbArtist">Найди музыку через поиск</div>
        </div>
        <button class="icon-btn" id="pbLike" aria-label="В любимые"><svg class="ico"><use href="#i-heart"/></svg></button>
      </div>

      <div class="player__center">
        <div class="player__buttons">
          <button class="icon-btn" id="btnShuffle" aria-label="Перемешать"><svg class="ico"><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" id="btnPrev" aria-label="Предыдущий"><svg class="ico"><use href="#i-prev"/></svg></button>
          <button class="play-btn" id="btnPlay" aria-label="Играть"><svg class="ico"><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="btnNext" aria-label="Следующий"><svg class="ico"><use href="#i-next"/></svg></button>
          <button class="icon-btn" id="btnRepeat" aria-label="Повтор"><svg class="ico"><use href="#i-repeat"/></svg></button>
        </div>
        <div class="player__progress">
          <span class="time" id="curTime">0:00</span>
          <input class="slider" type="range" id="progress" min="0" max="100" step="1" value="0" aria-label="Позиция воспроизведения">
          <span class="time" id="durTime">0:00</span>
        </div>
      </div>

      <div class="player__side player__side--right">
        <button class="icon-btn" id="btnQueue" aria-label="Очередь"><svg class="ico"><use href="#i-queue"/></svg></button>
        <button class="icon-btn" id="btnMute" aria-label="Звук"><svg class="ico"><use href="#i-volume"/></svg></button>
        <input class="slider slider--vol" type="range" id="volume" min="0" max="100" step="1" value="80" aria-label="Громкость">
      </div>
    </footer>

    <nav class="tabbar" aria-label="Навигация">
      <a href="#/home" data-nav="home"><svg class="ico"><use href="#i-home"/></svg><span>Главная</span></a>
      <a href="#/search" data-nav="search"><svg class="ico"><use href="#i-search"/></svg><span>Поиск</span></a>
      <a href="#/liked" data-nav="liked"><svg class="ico"><use href="#i-heart"/></svg><span>Любимые</span></a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;text-align:center">Для работы приложения нужен JavaScript.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
